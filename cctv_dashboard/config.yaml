name: "CCTV Dashboard"
version: "0.1.0"
slug: cctv_dashboard
description: "View and control Home Assistant cameras from a dedicated CCTV dashboard."
url: "https://github.com/davies1995/HA-CCTV"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: CCTV
panel_admin: true
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "CCTV Dashboard web UI (optional; Ingress preferred)"
options:
  log_level: info
  refresh_seconds: 5
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  refresh_seconds: int(1,60)
